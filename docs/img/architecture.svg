<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Luna host architecture, default install</title>
  <desc id="desc">Steam client exposes its CEF remote-debugging port. luna-host, a systemd user service written in C with an embedded Lua runtime, attaches over CDP, injects one polyfill and dispatches JSON calls to the Luna add-ons. No Steam files are patched.</desc>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#1b1b1b">Luna host architecture (default install)</text>

  <rect x="300" y="62" width="360" height="76" rx="8" fill="#eef3fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="480" y="92" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">Steam client</text>
  <text x="480" y="116" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333333">CEF remote-debugging port (loopback)</text>

  <line x1="480" y1="138" x2="480" y2="196" stroke="#4a6fa5" stroke-width="2"/>
  <polygon points="480,204 474,192 486,192" fill="#4a6fa5"/>
  <text x="492" y="164" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#444444">CDP over WebSocket</text>
  <text x="492" y="181" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#444444">same-uid peer check</text>

  <rect x="250" y="210" width="460" height="118" rx="8" fill="#f2f7ee" stroke="#5a8a44" stroke-width="2"/>
  <text x="480" y="239" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">luna-host.service (systemd --user)</text>
  <text x="480" y="264" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333333">C binary + embedded Lua 5.4 + libc-only helpers</text>
  <text x="480" y="286" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333333">port discovery · injector · one polyfill · JSON dispatch</text>
  <text x="480" y="308" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333333">injects into SharedJSContext only</text>

  <line x1="480" y1="328" x2="480" y2="374" stroke="#5a8a44" stroke-width="2"/>
  <polygon points="480,382 474,370 486,370" fill="#5a8a44"/>
  <text x="492" y="352" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#444444">discovers addons/</text>

  <rect x="60" y="392" width="200" height="72" rx="8" fill="#faf6ec" stroke="#b08a3e" stroke-width="2"/>
  <text x="160" y="421" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b">playtime</text>
  <text x="160" y="444" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#333333">local playtime ledgers</text>

  <rect x="280" y="392" width="200" height="72" rx="8" fill="#faf6ec" stroke="#b08a3e" stroke-width="2"/>
  <text x="380" y="421" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b">presence</text>
  <text x="380" y="444" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#333333">friend visibility</text>

  <rect x="500" y="392" width="200" height="72" rx="8" fill="#faf6ec" stroke="#b08a3e" stroke-width="2"/>
  <text x="600" y="421" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b">compressor</text>
  <text x="600" y="444" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#333333">Btrfs jobs (external tool)</text>

  <rect x="720" y="392" width="200" height="72" rx="8" fill="#faf6ec" stroke="#b08a3e" stroke-width="2"/>
  <text x="820" y="413" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b">luna shell</text>
  <text x="820" y="433" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#333333">menu · sgdb · graphics</text>
  <text x="820" y="451" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#333333">HLTB · Health</text>

  <rect x="60" y="490" width="860" height="48" rx="6" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1"/>
  <text x="80" y="519" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333333">~/.local/share/Luna: bin/luna-host · lua/ runtime · addons/ · state/ · host.json</text>
  <text x="920" y="519" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#8a2f2f">no Steam files patched</text>
</svg>
