name: Debug compressor cancel
on: [push, workflow_dispatch]
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: |
          echo "--- signal probe ---"
          cd /tmp && rm -f p
          setsid sh -c 'echo $$ > /tmp/p; exec nohup sleep 30 >/dev/null 2>&1 < /dev/null' &
          sleep 0.3; pid=$(cat /tmp/p); echo "pid=$pid"
          ps -o pid,pgid,sid,args -p "$pid" || true
          echo "pgrp field: $(awk '{print $5}' /proc/$pid/stat)"
          /bin/kill -TERM -"$pid"; sleep 1
          if ps -p "$pid" >/dev/null; then echo "driver SURVIVED group TERM"; else echo "driver died from group TERM"; fi
          echo "--- kill build ---"; /bin/kill --version 2>&1 | head -2; ls -l /bin/kill
          echo "--- second probe: bash parent waiting on child ---"
          cat > /tmp/drv.sh <<'EOS'
#!/bin/bash
set -u
i=0
walk() { sleep 5; }
i=$((i+1))
walk
rc=$?
echo "rc=$rc i=$i"
echo FINISH-LINE
EOS
          chmod +x /tmp/drv.sh; rm -f /tmp/p
          setsid sh -c 'echo $$ > /tmp/p; exec nohup /tmp/drv.sh >/tmp/drv.log 2>&1 < /dev/null' &
          sleep 0.5; pid=$(cat /tmp/p); /bin/kill -TERM -"$pid"; sleep 2
          echo "drv.log:"; cat /tmp/drv.log
