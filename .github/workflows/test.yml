name: Test SLS Luna
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash scripts/test-backend.sh
      - run: python3 scripts/luna.py verify
      - run: python3 -m py_compile scripts/luna.py tests/*.py
      - run: luac -p tests/bridge-smoke.lua bridge/bridge.lua addons/*/plugin/backend/main.lua
      - run: bash -n scripts/*.sh
