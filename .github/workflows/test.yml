name: Test SLS Luna
# Push and pull requests both run, nothing is cached and no secret is used: the
# job only reads the public repository, so a fork PR gets the same signal.
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags: tests/test_upgrade.py installs old release
      # tags and upgrades them, and skips without them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # lua5.4 + luac for the backend suites; cc/make so the native luna-host
      # suite is built and run here too instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 build-essential
      # One entry point, the same one a local run uses.
      - run: bash scripts/test-all.sh
